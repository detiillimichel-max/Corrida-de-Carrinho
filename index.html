<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida Fases Completa</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5;flex-wrap:wrap;padding:0 8px}
#hud div{background:rgba(0,0,0,.65);padding:8px 12px;border-radius:999px;font-weight:700;backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
#ctrl{position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 140px);left:0;right:0;display:flex;gap:12px;padding:0 24px;z-index:5}
#ctrl button{flex:1;height:84px;font-size:40px;border-radius:24px;border:none;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#ctrl button:active{transform:scale(.96);background:rgba(255,255,255,.24)}
#gameover,#phaseup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);z-index:10;padding:20px}
#gameover.show,#phaseup.show{display:flex}
.card{background:#141c2f;padding:28px;border-radius:24px;text-align:center;min-width:280px;max-width:400px}
.card h1{margin:0 0 10px}
.card button{margin-top:14px;padding:14px 20px;border:none;border-radius:12px;background:#ff9f0a;color:#111;font-weight:900;font-size:16px;width:100%;cursor:pointer}
</style></head><body>
<div id="hud">
<div>🪙 <span id="c">0</span></div>
<div id="phase">Fase 1</div>
<div id="t">60s</div>
<div id="lives">❤️❤️❤️</div>
<div id="shopBtn">🛒</div>
<div id="pauseBtn">⏸️</div>
</div>
<canvas id="cv"></canvas>
<div id="ctrl"><button id="l">◀️</button><button id="r">▶️</button></div>
<div id="phaseup"><div class="card"><h1 id="phaseTitle">Fase 2</h1><div id="phaseDesc"></div><button id="continue">Continuar</button></div></div>
<div id="gameover"><div class="card"><h1>Fim</h1><div>Moedas: <b id="finalc">0</b></div><div>Fase: <b id="finalphase">1</b></div><button id="restart">Jogar</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
let x=cv.width/2,y=cv.height*0.72,vx=0,coins=[],obs=[],prizes=[],t=0,cnt=0,lives=3,left=false,right=false,running=true,paused=false,curve=0;
let phase=1,phaseTime=60,phaseElapsed=0;
const themes=[
 {sky:['#87ceeb','#bfe6ff','#7cc96a'],grass:'#5a9e4a',side:'🌲',name:'Floresta'},
 {sky:['#ffecd2','#fcb69f','#7cc96a'],grass:'#6b8e23',side:'🌳',name:'Campo'},
 {sky:['#a1c4fd','#c2e9fb','#e0c097'],grass:'#d2b48c',side:'🌵',name:'Deserto'},
 {sky:['#0f2027','#203a43','#2c5364'],grass:'#1a2a3a',side:'🏔️',name:'Montanha'},
 {sky:['#ff9a9e','#fecfef','#7cc96a'],grass:'#8fbc8f',side:'🌸',name:'Primavera'},
 {sky:['#667eea','#764ba2','#5a9e4a'],grass:'#4a7c59',side:'🏠',name:'Cidade'},
 {sky:['#283e51','#485563','#5a9e4a'],grass:'#3a5f0b',side:'🌧️',name:'Chuva'},
 {sky:['#0b0b0b','#1a1a2e','#0f0f0f'],grass:'#0a3d0a',side:'🌙',name:'Noite'},
 {sky:['#ff512f','#dd2476','#7cc96a'],grass:'#c71585',side:'🎆',name:'Festival'}
];
function spawnCoin(){coins.push({x:Math.random()*(cv.width-140)+70,y:-30})}
function spawnObs(){obs.push({x:Math.random()*(cv.width-140)+70,y:-40})}
function spawnPrize(){if(Math.random()<0.4)prizes.push({x:Math.random()*(cv.width-140)+70,y:-30})}
setInterval(()=>{if(running&&!paused)spawnCoin()},900);
setInterval(()=>{if(running&&!paused)spawnObs()},1400);
setInterval(()=>{if(running&&!paused)spawnPrize()},5000);
function drawScenery(){
 const th=themes[(phase-1)%themes.length];
 const g=ctx.createLinearGradient(0,0,0,cv.height*0.6);
 g.addColorStop(0,th.sky[0]);g.addColorStop(0.5,th.sky[1]);g.addColorStop(1,th.sky[2]);
 ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle=th.grass;
 ctx.fillRect(0,0,cv.width/2-170,cv.height);
 ctx.fillRect(cv.width/2+170,0,cv.width/2-170,cv.height);
 ctx.font='32px serif';
 for(let i=0;i<8;i++){
   const ty=(t*80+i*130)%(cv.height+100)-50;
   ctx.fillText(th.side,40,ty);
   ctx.fillText(th.side,cv.width-70,ty+40);
 }
}
function loop(){
 if(!running||paused){requestAnimationFrame(loop);return}
 t+=0.016;phaseElapsed+=0.016;
 curve=Math.sin(t*0.5)*100;
 if(left) vx-=1.4; if(right) vx+=1.4; vx*=0.88; x+=vx; x=Math.max(70,Math.min(cv.width-70,x));
 y=cv.height*0.72;
 ctx.clearRect(0,0,cv.width,cv.height);
 drawScenery();
 ctx.fillStyle='#2a3447';
 ctx.fillRect(cv.width/2-170+curve*0.1,0,340,cv.height);
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=8;ctx.setLineDash([30,30]);
 for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cv.width/2+i*100+curve,0);ctx.lineTo(cv.width/2+i*100-curve,cv.height);ctx.stroke()}
 ctx.setLineDash([]);
 for(let i=coins.length-1;i>=0;i--){let c=coins[i];c.y+=6+phase*0.3;ctx.font='38px serif';ctx.fillText('🪙',c.x,c.y);if(Math.hypot(c.x-x,c.y-y)<48){coins.splice(i,1);cnt++;document.getElementById('c').textContent=cnt}else if(c.y>cv.height+60)coins.splice(i,1)}
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=7+phase*0.4;ctx.font='44px serif';ctx.fillText('🚧',o.x,o.y);if(Math.hypot(o.x-x,o.y-y)<48){obs.splice(i,1);lives--;updateLives();if(lives<=0)gameOver()}else if(o.y>cv.height+60)obs.splice(i,1)}
 for(let i=prizes.length-1;i>=0;i--){let p=prizes[i];p.y+=5;ctx.font='40px serif';ctx.fillText('⭐',p.x,p.y);if(Math.hypot(p.x-x,p.y-y)<48){prizes.splice(i,1);cnt+=5;document.getElementById('c').textContent=cnt}else if(p.y>cv.height+60)prizes.splice(i,1)}
 // car
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,10,28,12,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ff3b30';ctx.fillRect(-22,-35,44,70);
 ctx.fillStyle='#ff6b60';ctx.fillRect(-16,-20,32,30);
 ctx.fillStyle='#aee1ff';ctx.fillRect(-14,-30,28,12);ctx.fillRect(-14,5,28,12);
 ctx.fillStyle='#222';ctx.fillRect(-26,-28,6,14);ctx.fillRect(20,-28,6,14);ctx.fillRect(-26,14,6,14);ctx.fillRect(20,14,6,14);
 ctx.fillStyle='#fffb00';ctx.fillRect(-18,-38,8,4);ctx.fillRect(10,-38,8,4);
 ctx.restore();
 const remain=Math.max(0,Math.ceil(phaseTime-phaseElapsed));
 document.getElementById('t').textContent=remain+'s';
 if(phaseElapsed>=phaseTime){nextPhase()}
 requestAnimationFrame(loop);
}
function updateLives(){document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function nextPhase(){running=false;paused=true;phase=phase%9+1;document.getElementById('phaseTitle').textContent=`Fase ${phase} - ${themes[(phase-1)].name}`;document.getElementById('phaseDesc').textContent='Sobreviveu!';document.getElementById('phaseup').classList.add('show')}
document.getElementById('continue').onclick=()=>{document.getElementById('phaseup').classList.remove('show');phaseElapsed=0;running=true;paused=false;document.getElementById('phase').textContent=`Fase ${phase}`;coins=[];obs=[];prizes=[];loop()}
function gameOver(){running=false;document.getElementById('finalc').textContent=cnt;document.getElementById('finalphase').textContent=phase;document.getElementById('gameover').classList.add('show')}
document.getElementById('restart').onclick=()=>{x=cv.width/2;vx=0;coins=[];obs=[];prizes=[];t=0;cnt=0;lives=3;phase=1;phaseElapsed=0;running=true;paused=false;updateLives();document.getElementById('c').textContent=0;document.getElementById('phase').textContent='Fase 1';document.getElementById('gameover').classList.remove('show');loop()}
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶️':'⏸️'}
document.getElementById('shopBtn').onclick=()=>alert('Loja em breve!')
document.getElementById('l').onpointerdown=()=>left=true;document.getElementById('l').onpointerup=()=>left=false;document.getElementById('l').onpointerleave=()=>left=false;
document.getElementById('r').onpointerdown=()=>right=true;document.getElementById('r').onpointerup=()=>right=false;document.getElementById('r').onpointerleave=()=>right=false;
updateLives();loop();
</script></body></html>
