<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corrida de Carrinho</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="pill"><span class="ico">🪙</span><span id="coins">0</span></div>
    <div class="pill"><span class="ico">⏱️</span><span id="time">00:00</span></div>
    <div class="pill"><span class="ico">🏁</span><span id="lap">1/3</span></div>
    <div class="pill" id="shopBtn" style="pointer-events:auto;cursor:pointer">🛒 <b>Loja</b></div>
    <div class="pill" id="pauseBtn" style="pointer-events:auto;cursor:pointer">⏸️</div>
  </div>

  <div class="drift" id="driftTxt">DRIFT!</div>
  <div class="lapflag" id="lapFlag">VOLTA 2</div>

  <div class="controls">
    <div class="btn" id="leftBtn"><span>◀️</span></div>
    <div class="btn" id="rightBtn"><span>▶️</span></div>
  </div>

  <div class="screen" id="startScreen">
    <div class="card">
      <h1>🏎️ Corrida de Carrinho</h1>
      <div class="subtitle">Derrape, colete moedas e desvie dos cones!</div>
      <div class="stats">
        <div class="stat"><b id="bestLap">--</b><span>Melhor Volta</span></div>
        <div class="stat"><b id="totalCoins">0</b><span>Moedas</span></div>
        <div class="stat"><b id="skinName">Clássico</b><span>Carro</span></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <button class="btn-primary" id="playBtn">JOGAR</button>
        <button class="btn-secondary" id="openShopBtn">LOJA</button>
      </div>
      <div style="font-size:13px;opacity:.6">Toque esquerda/direita para esterçar • Acelera automático</div>
    </div>
  </div>

  <div class="screen hidden" id="gameOverScreen">
    <div class="card">
      <h1 id="endTitle">FIM DE JOGO</h1>
      <div class="subtitle" id="endSub">Você bateu!</div>
      <div class="stats">
        <div class="stat"><b id="endTime">00:00</b><span>Tempo</span></div>
        <div class="stat"><b id="endCoins">0</b><span>Moedas</span></div>
        <div class="stat"><b id="endLaps">1</b><span>Voltas</span></div>
      </div>
      <div class="row">
        <button class="btn-primary" id="retryBtn">REJOGAR</button>
        <button class="btn-secondary" id="menuBtn">MENU</button>
      </div>
    </div>
  </div>

  <div class="screen hidden" id="shopScreen">
    <div class="card">
      <div class="topbar">
        <h2>🛒 Loja de Skins</h2>
        <button class="close" id="closeShop">Fechar</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:#0b1222;border-radius:12px;padding:10px 14px;margin-bottom:10px">
        <div style="opacity:.8">Suas moedas</div>
        <div style="font-weight:900;font-size:20px">🪙 <span id="shopCoins">0</span></div>
      </div>
      <div class="shop" id="shopGrid"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
