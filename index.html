<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida Simples</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;background:linear-gradient(#87ceeb 0%,#bfe6ff 30%,#7cc96a 100%)}
#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;flex-wrap:wrap;padding:0 10px}
#hud div{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:999px;font-weight:700;backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px;cursor:pointer}
#ctrl{position:absolute;bottom:50px;left:0;right:0;display:flex;gap:12px;padding:0 24px;z-index:5}
#ctrl button{flex:1;height:90px;font-size:44px;border-radius:24px;border:none;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#ctrl button:active{transform:scale(.96);background:rgba(255,255,255,.22)}
#gameover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:10;padding:20px}
#gameover.show{display:flex}
.card{background:#141c2f;padding:28px;border-radius:24px;text-align:center;min-width:280px;max-width:400px}
.card h1{margin:0 0 10px}
.card button{margin-top:14px;padding:14px 20px;border:none;border-radius:12px;background:#ff9f0a;color:#111;font-weight:900;font-size:16px;width:100%;cursor:pointer}
.suggestions{text-align:left;margin-top:16px;background:#0b1222;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.suggestions b{color:#ff9f0a}
</style></head><body>
<div id="hud">
<div>🪙 <span id="c">0</span></div>
<div id="t">0s</div>
<div id="lives">❤️❤️❤️</div>
<div id="shopBtn">🛒 Loja</div>
<div id="pauseBtn">⏸️</div>
</div>
<canvas id="cv"></canvas>
<div id="ctrl"><button id="l">◀️</button><button id="r">▶️</button></div>
<div id="gameover"><div class="card">
<h1>Fim de Jogo</h1>
<div>Moedas: <b id="finalc">0</b></div>
<div>Tempo: <b id="finalt">0s</b></div>
<div>Recorde: <b id="best">0</b> moedas</div>
<div class="suggestions">
<b>Ideias para evoluir:</b><br>
• Modo turbo ao pegar 3 ⭐ seguidas<br>
• Skins de carro na loja 🛒<br>
• Pista com chuva e noite<br>
• Ranking online de amigos<br>
• Missões diárias com prêmios
</div>
<button id="restart">Jogar Novamente</button>
</div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
let x=cv.width/2,y=cv.height-140,vx=0,coins=[],obs=[],prizes=[],t=0,cnt=0,lives=3,left=false,right=false,running=true,paused=false,curve=0,best=Number(localStorage.getItem('corrida_best')||0);
document.getElementById('best').textContent=best;
function spawnCoin(){coins.push({x:Math.random()*(cv.width-120)+60,y:-30})}
function spawnObs(){obs.push({x:Math.random()*(cv.width-120)+60,y:-40})}
function spawnPrize(){if(Math.random()<0.4)prizes.push({x:Math.random()*(cv.width-120)+60,y:-30})}
setInterval(()=>{if(running&&!paused)spawnCoin()},900);
setInterval(()=>{if(running&&!paused)spawnObs()},1500);
setInterval(()=>{if(running&&!paused)spawnPrize()},5000);
function drawScenery(){
 // side grass with trees
 ctx.fillStyle='#5a9e4a';
 ctx.fillRect(0,0,cv.width/2-200,cv.height);
 ctx.fillRect(cv.width/2+200,0,cv.width/2-200,cv.height);
 // trees
 ctx.font='32px serif';
 for(let i=0;i<8;i++){
   const ty=(t*60+i*120)% (cv.height+100)-50;
   ctx.fillText('🌲',40,ty);
   ctx.fillText('🌳',cv.width-70,ty+40);
 }
 // mountains far
 ctx.fillStyle='rgba(255,255,255,.08)';
 ctx.beginPath();ctx.moveTo(0,cv.height*0.3);for(let i=0;i<5;i++){ctx.lineTo(i*100,cv.height*0.25+Math.sin(i+t*0.1)*10)}ctx.lineTo(0,cv.height*0.3);ctx.fill();
}
function loop(){
 if(!running||paused){requestAnimationFrame(loop);return}
 t+=0.016;
 curve=Math.sin(t*0.4)*100;
 if(left) vx-=1.3; if(right) vx+=1.3; vx*=0.88; x+=vx; x=Math.max(70,Math.min(cv.width-70,x));
 ctx.clearRect(0,0,cv.width,cv.height);
 drawScenery();
 // road
 ctx.fillStyle='#2a3447';
 ctx.fillRect(cv.width/2-200+curve*0.1,0,400,cv.height);
 // lane marks
 ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=8;ctx.setLineDash([30,30]);
 for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cv.width/2+i*120+curve,0);ctx.lineTo(cv.width/2+i*120-curve,cv.height);ctx.stroke()}
 ctx.setLineDash([]);
 // coins
 for(let i=coins.length-1;i>=0;i--){let c=coins[i];c.y+=6;c.x+=Math.sin(c.y*0.01)*0.6;ctx.font='38px serif';ctx.fillText('🪙',c.x,c.y);if(Math.hypot(c.x-x,c.y-y)<48){coins.splice(i,1);cnt++;document.getElementById('c').textContent=cnt}else if(c.y>cv.height+60)coins.splice(i,1)}
 // obstacles
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=7;ctx.font='44px serif';ctx.fillText('🚧',o.x,o.y);if(Math.hypot(o.x-x,o.y-y)<48){obs.splice(i,1);lives--;updateLives();if(lives<=0)gameOver()}else if(o.y>cv.height+60)obs.splice(i,1)}
 // prizes
 for(let i=prizes.length-1;i>=0;i--){let p=prizes[i];p.y+=5;ctx.font='40px serif';ctx.fillText('⭐',p.x,p.y);if(Math.hypot(p.x-x,p.y-y)<48){prizes.splice(i,1);cnt+=5;document.getElementById('c').textContent=cnt;flash()}else if(p.y>cv.height+60)prizes.splice(i,1)}
 // car front
 ctx.font='60px serif';ctx.textAlign='center';ctx.fillText('🚘',x,y);
 document.getElementById('t').textContent=Math.floor(t)+'s';
 requestAnimationFrame(loop);
}
function updateLives(){document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function flash(){document.body.style.filter='brightness(1.3)';setTimeout(()=>document.body.style.filter='',150)}
function gameOver(){running=false;document.getElementById('finalc').textContent=cnt;document.getElementById('finalt').textContent=Math.floor(t)+'s';if(cnt>best){best=cnt;localStorage.setItem('corrida_best',best)}document.getElementById('best').textContent=best;document.getElementById('gameover').classList.add('show')}
document.getElementById('restart').onclick=()=>{x=cv.width/2;vx=0;coins=[];obs=[];prizes=[];t=0;cnt=0;lives=3;running=true;paused=false;updateLives();document.getElementById('c').textContent=0;document.getElementById('gameover').classList.remove('show');loop()}
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶️':'⏸️'}
document.getElementById('shopBtn').onclick=()=>alert('Loja em breve! Troque moedas por skins 🚗✨')
document.getElementById('l').onpointerdown=()=>left=true;document.getElementById('l').onpointerup=()=>left=false;document.getElementById('l').onpointerleave=()=>left=false;
document.getElementById('r').onpointerdown=()=>right=true;document.getElementById('r').onpointerup=()=>right=false;document.getElementById('r').onpointerleave=()=>right=false;
updateLives();loop();
</script></body></html>
