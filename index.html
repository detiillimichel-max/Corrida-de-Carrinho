<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida Simples</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;background:linear-gradient(#1a2333,#0b1220)}
#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5}
#hud div{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:999px;font-weight:700;backdrop-filter:blur(6px)}
#ctrl{position:absolute;bottom:50px;left:0;right:0;display:flex;gap:12px;padding:0 24px;z-index:5}
#ctrl button{flex:1;height:90px;font-size:44px;border-radius:24px;border:none;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#ctrl button:active{transform:scale(.96);background:rgba(255,255,255,.22)}
#gameover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:10}
#gameover.show{display:flex}
.card{background:#141c2f;padding:28px;border-radius:24px;text-align:center;min-width:280px}
.card h1{margin:0 0 10px}
.card button{margin-top:14px;padding:14px 20px;border:none;border-radius:12px;background:#ff9f0a;color:#111;font-weight:900;font-size:16px;width:100%}
</style></head><body>
<div id="hud"><div>🪙 <span id="c">0</span></div><div id="t">0s</div><div id="lives">❤️❤️❤️</div></div>
<canvas id="cv"></canvas>
<div id="ctrl"><button id="l">◀️</button><button id="r">▶️</button></div>
<div id="gameover"><div class="card"><h1>Fim de Jogo</h1><div>Moedas: <b id="finalc">0</b></div><div>Tempo: <b id="finalt">0s</b></div><button id="restart">Jogar Novamente</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
let x=cv.width/2,y=cv.height-140,vx=0,coins=[],obs=[],prizes=[],t=0,cnt=0,lives=3,left=false,right=false,running=true,curve=0;
function spawnCoin(){coins.push({x:Math.random()*(cv.width-100)+50,y:-30})}
function spawnObs(){obs.push({x:Math.random()*(cv.width-100)+50,y:-40})}
function spawnPrize(){if(Math.random()<0.3)prizes.push({x:Math.random()*(cv.width-100)+50,y:-30})}
setInterval(spawnCoin,900);
setInterval(spawnObs,1400);
setInterval(spawnPrize,5000);
function loop(){
 if(!running)return;
 t+=0.016;
 curve=Math.sin(t*0.5)*80;
 if(left) vx-=1.2; if(right) vx+=1.2; vx*=0.88; x+=vx; x=Math.max(50,Math.min(cv.width-50,x));
 ctx.fillStyle='#0b1220';ctx.fillRect(0,0,cv.width,cv.height);
 // road
 ctx.fillStyle='#1e293b';ctx.fillRect(cv.width/2-200+curve*0.2,0,400,cv.height);
 // lane marks
 ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=8;ctx.setLineDash([30,30]);
 for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cv.width/2+i*120+curve,0);ctx.lineTo(cv.width/2+i*120-curve,cv.height);ctx.stroke()}
 ctx.setLineDash([]);
 // coins
 for(let i=coins.length-1;i>=0;i--){let c=coins[i];c.y+=6;c.x+=Math.sin(c.y*0.01)*0.5;ctx.font='38px serif';ctx.fillText('🪙',c.x,c.y);if(Math.hypot(c.x-x,c.y-y)<45){coins.splice(i,1);cnt++;document.getElementById('c').textContent=cnt}else if(c.y>cv.height+60)coins.splice(i,1)}
 // obstacles
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=7;ctx.font='42px serif';ctx.fillText('🚧',o.x,o.y);if(Math.hypot(o.x-x,o.y-y)<45){obs.splice(i,1);lives--;updateLives();if(lives<=0)gameOver()}else if(o.y>cv.height+60)obs.splice(i,1)}
 // prizes
 for(let i=prizes.length-1;i>=0;i--){let p=prizes[i];p.y+=5;ctx.font='38px serif';ctx.fillText('⭐',p.x,p.y);if(Math.hypot(p.x-x,p.y-y)<45){prizes.splice(i,1);cnt+=5;document.getElementById('c').textContent=cnt;flash()}else if(p.y>cv.height+60)prizes.splice(i,1)}
 // car
 ctx.font='56px serif';ctx.fillText('🚗',x-28,y-28);
 document.getElementById('t').textContent=Math.floor(t)+'s';
 requestAnimationFrame(loop);
}
function updateLives(){document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function flash(){document.body.style.filter='brightness(1.3)';setTimeout(()=>document.body.style.filter='',150)}
function gameOver(){running=false;document.getElementById('finalc').textContent=cnt;document.getElementById('finalt').textContent=Math.floor(t)+'s';document.getElementById('gameover').classList.add('show')}
document.getElementById('restart').onclick=()=>{x=cv.width/2;vx=0;coins=[];obs=[];prizes=[];t=0;cnt=0;lives=3;running=true;updateLives();document.getElementById('c').textContent=0;document.getElementById('gameover').classList.remove('show');loop()}
document.getElementById('l').onpointerdown=()=>left=true;document.getElementById('l').onpointerup=()=>left=false;document.getElementById('l').onpointerleave=()=>left=false;
document.getElementById('r').onpointerdown=()=>right=true;document.getElementById('r').onpointerup=()=>right=false;document.getElementById('r').onpointerleave=()=>right=false;
loop();
</script></body></html>
